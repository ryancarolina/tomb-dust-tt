llm:
  provider: openrouter
  model: anthropic/claude-haiku-4.5
  max_tokens: 2048
  creation_flavor_max_tokens: 500
  temperature: 0.8

tts:
  mode: speak_dialogue
  voice: en-US-GuyNeural
  rate: "+0%"
  npc_voice_default_male: en-US-AndrewNeural
  npc_voice_default_female: en-US-JennyNeural
  npc_voices:
    marshal-garrick-holt: en-US-SteffanNeural
    postern-clerk: en-US-ChristopherNeural
    breley-sergeant: en-US-EricNeural
    npc-male: en-US-AndrewNeural
    npc-female: en-US-JennyNeural

ui:
  window_width: 1280
  window_height: 800
  font_size: 16
  narration_width_ratio: 0.7
  character_panel_width_ratio: 0.22
  sidebar_width_ratio: 0.30

images:
  enabled: false
  provider: openrouter
  model: black-forest-labs/flux.2-klein-4b
  portrait_aspect_ratio: "1:1"
  scene_aspect_ratio: "4:3"
  max_generations_per_session: 30
  concurrency: 1
